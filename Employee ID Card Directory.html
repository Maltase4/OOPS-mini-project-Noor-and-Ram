<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Employee ID Card Directory</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F5;--surface:#FFFFFF;--border:#CDD5E0;--text:#1B2433;--muted:#5B6678;--brand:#14325C;--brand-2:#1F4E8C;--link:#1F4E8C;--on-brand:#fff;--accent:#B08D3C;
  --ok:#1E7B4F;--ok-bg:#E2F3EA;--bad:#A63232;--bad-bg:#F8E4E4;--field:#F7F9FC;--row:#F3F6FA;
  --font:'IBM Plex Sans',system-ui,'Segoe UI',Arial,sans-serif;--serif:'IBM Plex Serif',Georgia,serif}
:root[data-brand="slate"]{--brand:#2F3B4C;--brand-2:#475569;--link:#475569;--accent:#9AA7B8}
:root[data-brand="forest"]{--brand:#17433A;--brand-2:#23634F;--link:#23634F;--accent:#C2A24A}
:root[data-brand="burgundy"]{--brand:#5A1F2B;--brand-2:#7D2E3E;--link:#7D2E3E;--accent:#C9A66B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1623;--surface:#18212F;--border:#2D3A4F;--text:#E6EBF3;--muted:#9AA6B8;--field:#121A27;--row:#1C2738;--link:#9DBBE6;--ok:#59C48C;--ok-bg:#143427;--bad:#F08585;--bad-bg:#3A1B1B}}
:root[data-theme="dark"]{--bg:#0F1623;--surface:#18212F;--border:#2D3A4F;--text:#E6EBF3;--muted:#9AA6B8;--field:#121A27;--row:#1C2738;--link:#9DBBE6;--ok:#59C48C;--ok-bg:#143427;--bad:#F08585;--bad-bg:#3A1B1B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font)}
header{background:var(--brand);color:var(--on-brand);border-bottom:4px solid var(--accent)}
.bar{max-width:1100px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:600 20px var(--serif);margin:0}.sub{font-size:13px;opacity:.8}
.themes{display:flex;gap:8px;align-items:center;font-size:13px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.6);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid #fff;outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:22px 20px 40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand-2);border-radius:3px;padding:10px 14px}
.stat b{display:block;font:600 22px var(--serif)}.stat span{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:3px;background:var(--field);color:var(--text);font:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:1px}
.btn{padding:9px 16px;border-radius:3px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font:500 14px var(--font);cursor:pointer;white-space:nowrap}
.btn.sec{background:transparent;color:var(--link);border-color:var(--border)}
.btn.del{background:var(--bad);border-color:var(--bad);color:#fff}
.wrap{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th{background:var(--brand);color:var(--on-brand);text-align:left;font-weight:500;padding:10px 12px;font-size:13px}
td{padding:9px 12px;border-bottom:1px solid var(--border)}
tbody tr:nth-child(even){background:var(--row)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:2px;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.pill.off{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.act{display:flex;gap:6px}.act button{padding:4px 9px;font:500 12px var(--font);border:1px solid var(--border);background:transparent;color:var(--link);border-radius:3px;cursor:pointer}
.act button.d{color:var(--bad);border-color:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--border);border-radius:6px;padding:0;background:var(--surface);color:var(--text);width:min(460px,92vw);max-height:92vh}
dialog::backdrop{background:rgba(10,20,40,.55)}
.dh{background:var(--brand);color:var(--on-brand);padding:12px 18px;font:600 16px var(--serif);border-bottom:3px solid var(--accent)}
.db{padding:6px 18px 16px;overflow-y:auto}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:12px;min-height:16px}
.df{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--border)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:3px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;border-left:4px solid var(--accent)}
#toast.show{opacity:1}
.card{background:#fff;color:#1B2433;border-radius:10px;overflow:hidden;border:1px solid #CDD5E0;margin:14px auto 4px;max-width:340px;position:relative}
.card .top{background:var(--brand);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--accent)}
.co{font:600 14px var(--serif)}.co small{display:block;font:400 9px var(--font);letter-spacing:.06em;opacity:.8}
.card .body{padding:14px;display:flex;gap:12px}
.photo{width:66px;height:80px;flex:none;background:#E3E8F0;border:1px solid #CDD5E0;display:flex;align-items:center;justify-content:center;font:600 22px var(--serif);color:var(--brand)}
.nm{font:600 17px/1.2 var(--serif);margin:0}.pos{font-size:13px;color:#4A5568;margin:2px 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin:0}.kv dt{color:#667085}.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.foot{padding:10px 14px 12px;border-top:1px dashed #CDD5E0;background:#F7F9FC}
.foot svg{display:block;width:100%;height:46px}.bn{text-align:center;font:500 12px var(--font);letter-spacing:.3em;margin-top:3px}
.card.inactive .body{opacity:.5;filter:grayscale(1)}
.card.inactive::after{content:"INACTIVE";position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);font:700 30px var(--font);color:#A63232;border:4px solid #A63232;padding:2px 12px;border-radius:4px;opacity:.75}
</style>
</head>
<body>
<header><div class="bar">
  <div><h1>Employee ID Card Directory</h1><div class="sub">Corporate Access &amp; Identity Services</div></div>
  <div class="themes" role="group" aria-label="Color theme"><span>Theme</span>
    <button class="sw" data-b="navy" style="background:#14325C" aria-label="Corporate Navy" aria-pressed="true"></button>
    <button class="sw" data-b="slate" style="background:#2F3B4C" aria-label="Executive Slate" aria-pressed="false"></button>
    <button class="sw" data-b="forest" style="background:#17433A" aria-label="Forest Green" aria-pressed="false"></button>
    <button class="sw" data-b="burgundy" style="background:#5A1F2B" aria-label="Burgundy" aria-pressed="false"></button>
  </div>
</div></header>

<main>
  <div class="stats">
    <div class="stat"><b id="s1">0</b><span>Total employees</span></div>
    <div class="stat"><b id="s2">0</b><span>Active cards</span></div>
    <div class="stat"><b id="s3">0</b><span>Inactive cards</span></div>
  </div>
  <div class="tools">
    <input id="q" placeholder="Search by ID, name, department or work email" aria-label="Search employees">
    <button class="btn" id="add">+ New employee</button>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>ID</th><th>Name</th><th>Position</th><th>Department</th><th>Work email</th><th>Access</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="tb"></tbody>
  </table><div class="empty" id="empty" hidden>No employees found.</div></div>
</main>

<dialog id="fd"><div class="dh" id="ft">New employee</div><div class="db">
  <label for="fid">Employee ID (primary key / barcode)</label><input id="fid" inputmode="numeric" maxlength="9"><div class="err" id="e1"></div>
  <label for="fn">Full name</label><input id="fn"><div class="err" id="e2"></div>
  <div class="row"><div><label for="fp">Position</label><input id="fp"><div class="err" id="e3"></div></div>
  <div><label for="fdp">Department</label><select id="fdp"><option>IT</option><option>Human Resources</option><option>Finance</option><option>Operations</option><option>Legal</option><option>Sales</option></select></div></div>
  <label for="fm">Work email</label><input id="fm" type="email"><div class="err" id="e4"></div>
  <div class="row"><div><label for="fl">Access level</label><select id="fl"><option value="1">1 – Lobby</option><option value="2">2 – General office</option><option value="3">3 – Restricted floors</option><option value="4">4 – Server &amp; labs</option><option value="5">5 – Full access</option></select></div>
  <div><label for="fa">Status</label><select id="fa"><option value="1">Active</option><option value="0">Inactive</option></select></div></div>
</div><div class="df"><button class="btn sec" id="fc">Cancel</button><button class="btn" id="fs">Save</button></div></dialog>

<dialog id="vd"><div class="dh">Employee ID card</div><div class="db" id="vb"></div><div class="df"><button class="btn sec" id="vp">Print</button><button class="btn" id="vc">Close</button></div></dialog>

<dialog id="dd"><div class="dh">Delete employee</div><div class="db"><p id="dm"></p></div><div class="df"><button class="btn sec" id="dc">Cancel</button><button class="btn del" id="dy">Delete</button></div></dialog>

<div id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const KEY="employee_cards_v1";
const SEED=[
 {id:100245,name:"Aarav Sharma",pos:"Software Engineer",dep:"IT",mail:"aarav.sharma@company.com",lvl:5,on:true},
 {id:100312,name:"Priya Nair",pos:"HR Manager",dep:"Human Resources",mail:"priya.nair@company.com",lvl:3,on:true},
 {id:100418,name:"Rohan Mehta",pos:"Financial Analyst",dep:"Finance",mail:"rohan.mehta@company.com",lvl:2,on:true},
 {id:100527,name:"Kavita Joshi",pos:"Legal Counsel",dep:"Legal",mail:"kavita.joshi@company.com",lvl:4,on:false}];
let data;
try{const s=localStorage.getItem(KEY);data=s?JSON.parse(s):SEED.slice()}catch(e){data=SEED.slice()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
let editing=null,pendingDel=null,tt;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// READ
function render(){
  const q=$("q").value.trim().toLowerCase();
  const list=data.filter(e=>[e.id,e.name,e.dep,e.mail,e.pos].join(" ").toLowerCase().includes(q));
  $("tb").innerHTML=list.map(e=>`<tr>
    <td>${e.id}</td><td>${esc(e.name)}</td><td>${esc(e.pos)}</td><td>${esc(e.dep)}</td><td>${esc(e.mail)}</td><td>Level ${e.lvl}</td>
    <td><span class="pill ${e.on?"":"off"}">${e.on?"ACTIVE":"INACTIVE"}</span></td>
    <td><div class="act"><button data-a="v" data-i="${e.id}">View</button><button data-a="e" data-i="${e.id}">Edit</button><button data-a="t" data-i="${e.id}">${e.on?"Deactivate":"Activate"}</button><button class="d" data-a="d" data-i="${e.id}">Delete</button></div></td></tr>`).join("");
  $("empty").hidden=list.length>0;
  $("s1").textContent=data.length;$("s2").textContent=data.filter(e=>e.on).length;$("s3").textContent=data.filter(e=>!e.on).length;
}
function barcode(n){let b="101011";for(const c of String(n).padStart(6,"0")){const d=+c;b+=(d+3).toString(2).padStart(4,"0")+"0"+((d*7+5)%16).toString(2).padStart(4,"0")+"1"}b+="110101";
  const w=200/b.length;return [...b].map((x,i)=>x==="1"?`<rect x="${(i*w).toFixed(2)}" y="0" width="${(w*.9).toFixed(2)}" height="46" fill="#1B2433"/>`:"").join("")}
function view(e){
  const ini=e.name.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  $("vb").innerHTML=`<div class="card ${e.on?"":"inactive"}"><div class="top"><div class="co">Company Inc.<small>EMPLOYEE IDENTIFICATION</small></div><span class="pill ${e.on?"":"off"}" style="background:#fff">${e.on?"ACTIVE":"INACTIVE"}</span></div>
  <div class="body"><div class="photo">${esc(ini)}</div><div style="min-width:0"><p class="nm">${esc(e.name)}</p><p class="pos">${esc(e.pos)}</p>
  <dl class="kv"><dt>Dept.</dt><dd>${esc(e.dep)}</dd><dt>Work email</dt><dd>${esc(e.mail)}</dd><dt>Access</dt><dd>Level ${e.lvl}</dd></dl></div></div>
  <div class="foot"><svg viewBox="0 0 200 46" preserveAspectRatio="none" role="img" aria-label="Barcode">${barcode(e.id)}</svg><div class="bn">${e.id}</div></div></div>`;
  $("vd").showModal();
}

// CREATE / UPDATE form
function openForm(e){
  editing=e?e.id:null;
  $("ft").textContent=e?"Edit employee":"New employee";
  $("fid").value=e?e.id:"";$("fid").disabled=!!e;
  $("fn").value=e?e.name:"";$("fp").value=e?e.pos:"";$("fdp").value=e?e.dep:"IT";
  $("fm").value=e?e.mail:"";$("fl").value=e?e.lvl:"1";$("fa").value=e?(e.on?"1":"0"):"1";
  ["e1","e2","e3","e4"].forEach(i=>$(i).textContent="");
  $("fd").showModal();
}
function submit(){
  const id=editing??$("fid").value.trim(),name=$("fn").value.trim(),pos=$("fp").value.trim(),mail=$("fm").value.trim();
  let ok=true;const set=(k,m)=>{$(k).textContent=m;if(m)ok=false};
  set("e1",editing!==null?"":!/^\d{4,9}$/.test(id)?"ID must be 4–9 digits.":data.some(e=>e.id===+id)?"This Employee ID already exists.":"");
  set("e2",name?"":"Name is required.");
  set("e3",pos?"":"Position is required.");
  set("e4",/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)?"":"Enter a valid work email.");
  if(!ok)return;
  const rec={id:+id,name,pos,dep:$("fdp").value,mail,lvl:+$("fl").value,on:$("fa").value==="1"};
  if(editing!==null){data=data.map(e=>e.id===editing?rec:e);toast("Employee updated.")}
  else{data.push(rec);toast("Employee created.")}
  save();render();$("fd").close();
}

$("add").onclick=()=>openForm(null);
$("fs").onclick=submit;$("fc").onclick=()=>$("fd").close();
$("vc").onclick=()=>$("vd").close();$("vp").onclick=()=>window.print();
$("q").oninput=render;
$("tb").onclick=ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const e=data.find(x=>x.id===+b.dataset.i);if(!e)return;
  const a=b.dataset.a;
  if(a==="v")view(e);
  else if(a==="e")openForm(e);
  else if(a==="t"){e.on=!e.on;save();render();toast(e.on?"Card activated.":"Card deactivated.")}   // UPDATE (status)
  else if(a==="d"){pendingDel=e;$("dm").textContent=`Delete ${e.name} (ID ${e.id})? This cannot be undone.`;$("dd").showModal()}
};
// DELETE
$("dc").onclick=()=>$("dd").close();
$("dy").onclick=()=>{data=data.filter(e=>e.id!==pendingDel.id);save();render();$("dd").close();toast("Employee deleted.")};

document.querySelectorAll(".sw").forEach(s=>s.onclick=()=>{
  document.documentElement.dataset.brand=s.dataset.b;
  document.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed",x===s));
});
render();
</script>
</body>
</html>
